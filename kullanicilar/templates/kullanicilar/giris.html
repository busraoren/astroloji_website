{% extends 'burcs/base.html' %}

{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="text-center mb-8">
        <p class="text-sm tracking-[0.2em] text-rose-300 font-normal mb-3">✦ TEKRAR HOŞ GELDİN ✦</p>
        <h2 class="font-baslik text-3xl text-gradient-gold">Giriş Yap</h2>
    </div>

    <div class="card-elegant rounded-3xl p-8">
        {% if hata %}
            <p class="text-rose-300 text-sm mb-4 text-center bg-rose-500/10 border border-rose-500/30 rounded-lg py-2">{{ hata }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label class="block mb-2 text-sm text-gray-300">Kullanıcı Adı</label>
            <input type="text" name="username" class="w-full p-3 rounded-lg bg-white/5 border border-rose-300/20 mb-4 text-gray-100 focus:border-rose-300/50 focus:outline-none transition">

            <label class="block mb-2 text-sm text-gray-300">Şifre</label>
            <input type="password" name="password" class="w-full p-3 rounded-lg bg-white/5 border border-rose-300/20 mb-4 text-gray-100 focus:border-rose-300/50 focus:outline-none transition">

            <button type="submit" class="holo-btn w-full font-semibold py-3 rounded-full mt-2 tracking-wide text-sm">
                GİRİŞ YAP
            </button>
        </form>

        <p class="text-center text-sm text-gray-400 mt-5">
            Hesabın yok mu? <a href="{% url 'kayit' %}" class="text-rose-300 hover:text-rose-200 transition">Kayıt ol</a>
        </p>
        <p class="text-center text-sm text-gray-400 mt-2">
            <a href="{% url 'password_reset' %}" class="text-rose-300 hover:text-rose-200 transition">Şifremi unuttum</a>
        </p>
    </div>
</div>
{% endblock %}
