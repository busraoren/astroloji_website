{% extends 'burcs/base.html' %}

{% block title %}Kayıt Ol{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
    <div class="text-center mb-8">
        <p class="text-sm tracking-[0.2em] text-rose-300 font-normal mb-3">✦ YOLCULUĞUNA BAŞLA ✦</p>
        <h2 class="font-baslik text-3xl text-gradient-gold">Kayıt Ol</h2>
    </div>

    <div class="card-elegant rounded-3xl p-8">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="holo-btn w-full font-semibold py-3 rounded-full mt-4 tracking-wide text-sm">
                KAYIT OL
            </button>
        </form>

        <p class="text-center text-sm text-gray-400 mt-5">
            Zaten hesabın var mı? <a href="{% url 'giris' %}" class="text-rose-300 hover:text-rose-200 transition">Giriş yap</a>
        </p>
    </div>
</div>
{% endblock %}
