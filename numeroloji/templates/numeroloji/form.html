{% extends 'burcs/base.html' %}

{% block title %}Numeroloji{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="text-center mb-8">
        <p class="text-sm tracking-[0.2em] text-rose-300 font-normal mb-3">✦ SAYILARIN GİZLİ DİLİ ✦</p>
        <h2 class="font-baslik text-3xl text-gradient-gold">Numeroloji Analizi</h2>
        <p class="text-gray-400 text-sm mt-3">İsmin ve doğum tarihin, kaderinin şifrelerini taşır.</p>
    </div>

    <div class="card-elegant rounded-3xl p-8">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="holo-btn w-full font-semibold py-3 rounded-full mt-4 tracking-wide text-sm">
                HESAPLA
            </button>
        </form>
    </div>
</div>
{% endblock %}
