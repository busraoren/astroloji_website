{% extends 'burcs/base.html' %}

{% block title %}astrobacılar - Kozmik Test{% endblock %}

{% block content %}
<style>
    .fade-enter { opacity: 0; transform: translateY(10px); transition: all 0.5s ease-out; }
    .fade-enter-active { opacity: 1; transform: translateY(0); }
    .fade-exit { opacity: 1; transform: translateY(0); transition: all 0.4s ease-in; }
    .fade-exit-active { opacity: 0; transform: translateY(-10px); }

    .test-option {
        background: rgba(12, 5, 22, 0.4);
        border: 1px solid rgba(147, 51, 234, 0.2);
        transition: all 0.3s ease;
    }
    .test-option:hover {
        background: rgba(215, 105, 141, 0.1);
        border-color: rgba(229, 192, 123, 0.5);
        box-shadow: 0 0 15px rgba(215, 105, 141, 0.15);
        transform: scale(1.02);
    }
</style>

<div class="max-w-3xl mx-auto mb-16">

    <a href="{% url 'anasayfa' %}" class="inline-flex items-center gap-2 text-[10px] tracking-[0.2em] text-[#9486a8] hover:text-pink-300 transition uppercase mb-8">
        <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
    </a>

    <div class="card-line-art corner-marks p-8 md:p-14 text-center relative overflow-hidden min-h-[450px] flex flex-col justify-center" id="quiz-container">

        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_rgba(215,105,141,0.05),_transparent_70%)] pointer-events-none"></div>
        <i class="fas fa-moon absolute top-10 right-10 text-6xl text-pink-500/5 pointer-events-none -rotate-12"></i>
        <i class="fas fa-star absolute bottom-10 left-10 text-4xl text-gold/5 pointer-events-none animate-pulse"></i>

        <!-- BAŞLANGIÇ EKRANI -->
        <div id="screen-intro" class="relative z-10 fade-enter fade-enter-active">
            <div class="text-5xl mb-6 text-gold drop-shadow-[0_0_15px_rgba(229,192,123,0.3)]" id="intro-icon">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
            <h1 class="font-serif-mystic text-3xl md:text-5xl text-gray-100 mb-4 font-light" id="intro-title">Yükleniyor...</h1>
            <p class="text-sm text-gray-400 font-light leading-relaxed max-w-md mx-auto mb-8" id="intro-desc"></p>
            <button onclick="startQuiz()" class="btn-elegant">
                YOLCULUĞA BAŞLA <i class="fas fa-sparkles ml-2 text-[10px]"></i>
            </button>
        </div>

        <!-- SORU EKRANI -->
        <div id="screen-question" class="relative z-10 hidden">
            <p class="text-[10px] tracking-[0.3em] text-pink-400 uppercase mb-6" id="progress-text">Soru 1</p>
            <h2 class="font-serif-mystic text-2xl md:text-3xl text-gold mb-8 font-light leading-snug" id="question-text"></h2>
            <div class="flex flex-col gap-4 max-w-lg mx-auto w-full" id="options-container"></div>
        </div>

        <!-- SONUÇ EKRANI -->
        <div id="screen-result" class="relative z-10 hidden">
            <p class="text-[10px] tracking-[0.3em] text-gold uppercase mb-4 flex items-center justify-center gap-2">
                <i class="fas fa-star text-pink-400 text-xs"></i> Kozmik Sonucun <i class="fas fa-star text-pink-400 text-xs"></i>
            </p>
            <div class="text-6xl md:text-7xl mb-6 text-pink-300 drop-shadow-[0_0_20px_rgba(215,105,141,0.4)]" style="font-family: 'Noto Sans Symbols2', sans-serif;" id="result-icon"></div>
            <h3 class="font-serif-mystic text-4xl md:text-5xl text-gray-100 mb-4 font-light" id="result-title"></h3>
            <p class="text-sm md:text-base text-gray-400 font-light leading-relaxed max-w-lg mx-auto mb-10" id="result-desc"></p>

            <button onclick="resetQuiz()" class="text-[10px] tracking-[0.2em] text-[#9486a8] hover:text-gold transition uppercase border-b border-transparent hover:border-gold pb-1">
                <i class="fas fa-redo mr-2"></i> Baştan Başla
            </button>
        </div>

    </div>
</div>

<script>
    // --- BÜTÜN TESTLERİN VERİTABANI ---
    const testDB = {
        "kahve": {
            title: "Kahve Tercihine Göre<br>Ruh Eşin Kim?",
            desc: "İçtiğin kahve ruhunun yansımasıdır. Soruları sezgilerinle cevapla ve enerjine en uygun burcu öğren.",
            icon: "<i class='fas fa-coffee'></i>",
            questions: [
                {
                    text: "Sabah uyandığında ilk kahveni nasıl istersin?",
                    options: [
                        { text: "Sade ve sert bir filtre kahve (Netlik ararım)", category: "earth_water" },
                        { text: "Bol köpüklü, karamelli bir Latte (Tatlılık ararım)", category: "air_fire" },
                        { text: "Soğuk ve yenilikçi bir Frappuccino (Farklılık ararım)", category: "air_fire" }
                    ]
                },
                {
                    text: "Kahveni nerede yudumlamak sana huzur verir?",
                    options: [
                        { text: "Yağmur yağarken cam kenarında, evimde.", category: "earth_water" },
                        { text: "Kalabalık, hareketli ve estetik bir kafede.", category: "air_fire" },
                        { text: "Doğanın tam ortasında, kamp yaparken.", category: "earth_water" }
                    ]
                }
            ],
            results: {
                "earth_water": {
                    title: "Oğlak veya Akrep", icon: "♑︎ ♏︎",
                    desc: "Net, kararlı ve derinlikli bir ruha sahipsin. Karmaşadan uzak duruşunu ve sadakatini ancak senin gibi sağlam basan bir Toprak veya Su grubu burcu dengeleyebilir."
                },
                "air_fire": {
                    title: "İkizler veya Yay", icon: "♊︎ ♐︎",
                    desc: "Ruhun özgürlüğe, yeniliğe ve maceraya aç! Senin o enerjik, değişken ve tatlı kahveler gibi renkli ruhunu en iyi bir Hava veya Ateş burcu tamamlayabilir."
                }
            }
        },
        "manifest": {
            title: "Hangi Manifest<br>Kızısın?",
            desc: "Burcuna ve yaşam tarzına göre evrene frekanslarını nasıl gönderiyorsun? Aura kodunu çöz.",
            icon: "<i class='fas fa-magic'></i>",
            questions: [
                {
                    text: "Güne başlarken ilk yaptığın ritüel nedir?",
                    options: [
                        { text: "Astroloji haritama bakmak veya tarot çekmek.", category: "witchy" },
                        { text: "Günün hedeflerini planlayıp mantıklı adımlar atmak.", category: "boss" },
                        { text: "Detaylı bir cilt bakımı yapıp estetik bir kahve hazırlamak.", category: "aesthetic" }
                    ]
                },
                {
                    text: "Zor bir bitiş yaşadığında (örneğin bir ayrılık) enerjini nasıl temizlersin?",
                    options: [
                        { text: "Tarot açılımı yapıp kendi içsel enerjime ve mesajlara odaklanırım.", category: "witchy" },
                        { text: "Mantığımla hareket edip hızla kendi merkezime ve projelerime dönerim.", category: "boss" },
                        { text: "Gardırobumu yenileyip, yeni bir imajla taze bir sayfa açarım.", category: "aesthetic" }
                    ]
                },
                {
                    text: "İlham panonda (Vision Board) hangisi daha çok yer kaplar?",
                    options: [
                        { text: "Kariyer, yazılım, teknoloji hedefleri ve başarı kareleri.", category: "boss" },
                        { text: "Mistik semboller, doğal taşlar ve astroloji haritaları.", category: "witchy" },
                        { text: "Pastel tonlarda sokak modası ve estetik kahve fincanları.", category: "aesthetic" }
                    ]
                }
            ],
            results: {
                "witchy": {
                    title: "Witchy Manifest Kızı", icon: "🌙",
                    desc: "Evrenin diliyle konuşuyorsun. Sezgilerin çok kuvvetli ve enerjileri okumakta ustasın. Kartlar ve yıldızlar sana her zaman doğru yolu gösteriyor."
                },
                "boss": {
                    title: "Boss Girl Manifest", icon: "💻",
                    desc: "Senin manifestin sadece düşünmekten değil, başarmaktan geçiyor! Analitik, kurgulayan ve yöneten bir auran var. Hedeflerine her zaman ulaşıyorsun."
                },
                "aesthetic": {
                    title: "Soft Aesthetic Manifest", icon: "🌸",
                    desc: "Hayatının her köşesine güzellik katmayı seviyorsun. Pozitif, zarif ve pastel frekanslarınla iyi enerjileri bir mıknatıs gibi kendine çekiyorsun."
                }
            }
        },
        "aura": {
            title: "Aura Rengin Ne?",
            desc: "Hayat düzenine, zevklerine ve içsel dünyana göre çevrene yaydığın ışık hangi renk?",
            icon: "<i class='fas fa-eye'></i>",
            questions: [
                {
                    text: "Hafta sonu deşarj olmak için ideal aktiviten nedir?",
                    options: [
                        { text: "Mutfağa girip detaylı ve uğraştırıcı tatlılar/pastalar yapmak.", category: "pink_blue" },
                        { text: "Psikolojik gerilim dizileri izleyip karakter analizleri yapmak.", category: "indigo" },
                        { text: "Kortlara çıkıp biraz raket sallamak veya aktif olmak.", category: "green" }
                    ]
                },
                {
                    text: "Gardırobunu açtığında gözüne en çok hangi tonlar çarpar?",
                    options: [
                        { text: "Pastel maviler, pembeler ve açık denim kombinler.", category: "pink_blue" },
                        { text: "Koyu, siyah ve iddialı mistik tonlar.", category: "indigo" },
                        { text: "Doğal toprak tonları, bejler ve yeşiller.", category: "green" }
                    ]
                }
            ],
            results: {
                "pink_blue": {
                    title: "Pastel Mavi / Pembe Aura", icon: "✨",
                    desc: "Zarif, tatlı ve estetik bir enerjin var. İnsanlar senin yanında huzur ve naiflik hissediyor. Detaylara verdiğin özen aurana pastel bir ışıltı katıyor."
                },
                "indigo": {
                    title: "İndigo / Derin Mor Aura", icon: "🔮",
                    desc: "Derin, gizemli ve analitiksin. Yüzeysel şeylerden hoşlanmıyorsun. Çevrendekiler senin güçlü sezgilerini ve karanlık estetiğini hemen fark ediyor."
                },
                "green": {
                    title: "Canlı ve Dinamik Yeşil Aura", icon: "🌿",
                    desc: "Enerjik, aktif ve büyümeye açıksın. Durağanlık sana göre değil. Etrafına şifa veren, hareketli ve çok canlı bir frekans yayıyorsun."
                }
            }
        },
        "muzik": {
            title: "Hangi Alternatif Müzik Tarzısın?",
            desc: "Zodyak elementine ve hislerine göre ruhun hangi melodide yankılanıyor?",
            icon: "<i class='fas fa-headphones-alt'></i>",
            questions: [
                {
                    text: "Eğer uzun bir projeye veya karmaşık bir koda odaklanıyor olsaydın arka planda ne çalardı?",
                    options: [
                        { text: "Sözsüz, derin ve melankolik Lo-Fi ritimleri.", category: "lofi" },
                        { text: "Karanlık, tempolu ve atmosferik Dark Wave tınılar.", category: "darkwave" },
                        { text: "Hareketli, isyankar ve enerjik Alt-Rock parçalar.", category: "altrock" }
                    ]
                },
                {
                    text: "Duygularını nasıl yaşarsın?",
                    options: [
                        { text: "Sakin, içe dönük ve kendi dünyamda.", category: "lofi" },
                        { text: "Derinlerde kopan fırtınalarla ve analiz ederek.", category: "darkwave" },
                        { text: "Dışa dönük, tutkulu ve tepkisel.", category: "altrock" }
                    ]
                }
            ],
            results: {
                "lofi": {
                    title: "Dreampop / Lo-Fi", icon: "🎧",
                    desc: "Ruhun sakin sular gibi. Nostaljiyi, estetiği ve huzuru seviyorsun. Senin müziğin, yağmurlu bir günde cam kenarında dinlenen yumuşak bir melodi."
                },
                "darkwave": {
                    title: "Dark Wave / Synth", icon: "🎹",
                    desc: "Karanlık ve yoğun bir auran var. Derin psikolojik katmanların, güçlü bir elektronik bass ritmi gibi etrafındakileri etkisi altına alıyor."
                },
                "altrock": {
                    title: "Indie / Alt-Rock", icon: "🎸",
                    desc: "Hareketli, isyankar ve tamamen özgünsün! Kurallara uymaktansa kendi ritmini yaratmayı tercih ediyorsun. Dinamik ve ateşli bir ruhun var."
                }
            }
        }
    };

    // --- ALTYAPI MANTIĞI ---
    let currentTestId = "kahve"; // Varsayılan
    let activeTest = null;
    let currentQuestionIndex = 0;
    let scores = {};

    const screenIntro = document.getElementById("screen-intro");
    const screenQuestion = document.getElementById("screen-question");
    const screenResult = document.getElementById("screen-result");

    // Testi Başlatma ve URL'den ID Çekme
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const requestedId = urlParams.get('id');

        if (requestedId && testDB[requestedId]) {
            currentTestId = requestedId;
        }

        activeTest = testDB[currentTestId];

        // Giriş Ekranını Doldur
        document.getElementById("intro-icon").innerHTML = activeTest.icon;
        document.getElementById("intro-title").innerHTML = activeTest.title;
        document.getElementById("intro-desc").innerHTML = activeTest.desc;
    };

    function switchScreen(hideElement, showElement, callback = null) {
        hideElement.classList.add("fade-exit-active");
        setTimeout(() => {
            hideElement.classList.add("hidden");
            hideElement.classList.remove("fade-exit-active", "fade-enter-active");

            showElement.classList.remove("hidden");
            showElement.classList.add("fade-enter");
            if (callback) callback();

            setTimeout(() => {
                showElement.classList.add("fade-enter-active");
            }, 50);
        }, 400);
    }

    function startQuiz() {
        scores = {}; // Skorları sıfırla
        switchScreen(screenIntro, screenQuestion, loadQuestion);
    }

    function loadQuestion() {
        const q = activeTest.questions[currentQuestionIndex];
        document.getElementById("progress-text").innerText = `Soru ${currentQuestionIndex + 1} / ${activeTest.questions.length}`;
        document.getElementById("question-text").innerText = q.text;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "test-option px-6 py-4 rounded-xl text-sm md:text-base text-gray-300 font-light tracking-wide text-left w-full cursor-pointer";
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt.category);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(category) {
        scores[category] = (scores[category] || 0) + 1;
        currentQuestionIndex++;

        if (currentQuestionIndex >= activeTest.questions.length) {
            calculateResult();
        } else {
            screenQuestion.classList.add("fade-exit-active");
            setTimeout(() => {
                loadQuestion();
                screenQuestion.classList.remove("fade-exit-active");
            }, 400);
        }
    }

    function calculateResult() {
        // En yüksek puanlı kategoriyi bul
        let finalCategory = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        let resData = activeTest.results[finalCategory];

        document.getElementById("result-title").innerText = resData.title;
        document.getElementById("result-icon").innerText = resData.icon;
        document.getElementById("result-desc").innerText = resData.desc;

        switchScreen(screenQuestion, screenResult);
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        switchScreen(screenResult, screenIntro);
    }
</script>
{% endblock %}
