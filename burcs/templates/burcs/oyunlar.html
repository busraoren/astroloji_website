{% extends 'burcs/base.html' %}

{% block title %}astrobacılar - Kozmik Oyunlar{% endblock %}

{% block content %}
<style>
    /* Hafıza Oyunu Kart Animasyonları */
    .memory-card {
        perspective: 1000px;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    }
    .memory-card.flip {
        transform: rotateY(180deg);
    }
    .memory-front, .memory-back {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
    }
    .memory-front {
        transform: rotateY(180deg);
    }

    /* Savaş Oyunu Animasyonları */
    @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        25% { transform: translate(-1px, -2px) rotate(-1deg); }
        50% { transform: translate(-3px, 0px) rotate(1deg); }
        75% { transform: translate(3px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -1px) rotate(0deg); }
    }
    .damage-shake {
        animation: shake 0.3s;
    }
</style>

<div class="max-w-4xl mx-auto space-y-12 mb-16">

    <!-- 1. OYUN: GEZEGEN EŞLEŞTİRME -->
    <div class="card-line-art corner-marks p-8 relative overflow-hidden">
        <div class="text-center mb-8">
            <h2 class="font-serif-mystic text-3xl text-gold font-light mb-2">Kozmik Hafıza</h2>
            <p class="text-[11px] text-[#9486a8] tracking-[0.2em] uppercase">Gezegenleri Eşleştir</p>
        </div>
        
        <div class="grid grid-cols-4 gap-3 sm:gap-4 max-w-md mx-auto" id="memory-board">
            <!-- Kartlar JS ile buraya yüklenecek -->
        </div>
        
        <div class="text-center mt-8">
            <p id="memory-moves" class="text-xs text-pink-300 mb-4 tracking-widest hidden">Hamle: <span>0</span></p>
            <button onclick="initMemoryGame()" class="btn-elegant !text-[10px]">
                <i class="fas fa-redo mr-2"></i> YENİDEN BAŞLAT
            </button>
        </div>
    </div>

    <!-- 2. OYUN: GÜNEŞ VS AY DÜELLOSU -->
    <div class="card-line-art corner-marks p-8 relative overflow-hidden">
        <div class="text-center mb-10">
            <h2 class="font-serif-mystic text-3xl text-gold font-light mb-2">Göksel Düello</h2>
            <p class="text-[11px] text-[#9486a8] tracking-[0.2em] uppercase">Güneş ve Ay'ın Savaşı</p>
        </div>

        <!-- Savaş Arenası -->
        <div id="battle-arena" class="relative w-full h-48 bg-black/20 rounded-2xl border border-[rgba(215,105,141,0.1)] flex items-center justify-between px-6 sm:px-12 overflow-hidden">
            
            <!-- Güneş (Sen) -->
            <div id="fighter-sun" class="flex flex-col items-center z-10 w-24">
                <div class="w-full bg-gray-800 h-1.5 rounded-full mb-3 overflow-hidden">
                    <div id="hp-sun" class="bg-gold-light h-full w-full transition-all duration-300"></div>
                </div>
                <div class="w-16 h-16 rounded-full bg-gold-light/10 flex items-center justify-center drop-shadow-[0_0_15px_rgba(229,192,123,0.4)]">
                    <i class="fas fa-sun text-4xl text-gold animate-[spin_10s_linear_infinite]"></i>
                </div>
                <span class="text-[10px] text-gold tracking-widest mt-3 uppercase">Güneş (Sen)</span>
            </div>

            <!-- VS Metni -->
            <div class="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[#9486a8]/30 font-serif-mystic text-4xl italic">
                VS
            </div>

            <!-- Ay (Düşman) -->
            <div id="fighter-moon" class="flex flex-col items-center z-10 w-24">
                <div class="w-full bg-gray-800 h-1.5 rounded-full mb-3 overflow-hidden">
                    <div id="hp-moon" class="bg-pink-400 h-full w-full transition-all duration-300"></div>
                </div>
                <div class="w-16 h-16 rounded-full bg-pink-500/10 flex items-center justify-center drop-shadow-[0_0_15px_rgba(215,105,141,0.4)]">
                    <i class="fas fa-moon text-4xl text-pink-300 -rotate-12"></i>
                </div>
                <span class="text-[10px] text-pink-300 tracking-widest mt-3 uppercase">Ay (Zeka)</span>
            </div>
            
        </div>

        <!-- Savaş Butonları -->
        <div class="text-center mt-8 space-y-4">
            <p id="battle-log" class="text-xs text-gray-300 italic h-4 mb-4">Savaşı başlatmak için saldır!</p>
            <button id="attack-btn" onclick="sunAttack()" class="btn-elegant !text-[10px]">
                <i class="fas fa-meteor mr-2"></i> YILDIZ FIRLAT
            </button>
            <button id="reset-battle-btn" onclick="initBattle()" class="btn-elegant !text-[10px] hidden">
                <i class="fas fa-redo mr-2"></i> TEKRAR OYNA
            </button>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // 1. OYUN: KOZMİK HAFIZA (MEMORY GAME)
    // ==========================================
    const symbols = ['fa-sun text-gold', 'fa-moon text-pink-300', 'fa-meteor text-orange-400', 'fa-globe-europe text-blue-300', 'fa-star text-yellow-200', 'fa-bolt text-purple-400', 'fa-eye text-green-300', 'fa-fire text-red-400'];
    let cardsArray = [...symbols, ...symbols]; // Çiftleri oluştur
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let moves = 0;
    let matches = 0;

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function initMemoryGame() {
        const board = document.getElementById('memory-board');
        board.innerHTML = '';
        cardsArray = shuffle(cardsArray);
        moves = 0;
        matches = 0;
        document.querySelector('#memory-moves span').innerText = moves;
        document.getElementById('memory-moves').classList.remove('hidden');

        cardsArray.forEach((symbol, index) => {
            const card = document.createElement('div');
            card.classList.add('memory-card', 'relative', 'h-20', 'sm:h-24', 'w-full', 'cursor-pointer');
            card.dataset.symbol = symbol;

            card.innerHTML = `
                <!-- Arka Yüz (Kapalı Hali) -->
                <div class="memory-back absolute inset-0 bg-[#10051f] border-[rgba(215,105,141,0.2)] rounded-xl flex items-center justify-center hover:border-pink-400 transition-colors">
                    <i class="fas fa-sparkles text-pink-500/30"></i>
                </div>
                <!-- Ön Yüz (Açık Hali) -->
                <div class="memory-front absolute inset-0 bg-[#1a0b2e] border border-gold/50 rounded-xl flex items-center justify-center shadow-[0_0_15px_rgba(229,192,123,0.2)]">
                    <i class="fas ${symbol} text-2xl sm:text-3xl"></i>
                </div>
            `;
            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard) return;
        if (this === firstCard) return;

        this.classList.add('flip');

        if (!hasFlippedCard) {
            hasFlippedCard = true;
            firstCard = this;
            return;
        }

        secondCard = this;
        moves++;
        document.querySelector('#memory-moves span').innerText = moves;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;

        if (isMatch) {
            disableCards();
            matches++;
            if(matches === symbols.length) {
                setTimeout(() => alert(`Tebrikler! Kozmik hafızanı ${moves} hamlede tamamladın.`), 500);
            }
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        firstCard.removeEventListener('click', flipCard);
        secondCard.removeEventListener('click', flipCard);
        resetBoard();
    }

    function unflipCards() {
        lockBoard = true;
        setTimeout(() => {
            firstCard.classList.remove('flip');
            secondCard.classList.remove('flip');
            resetBoard();
        }, 1000);
    }

    function resetBoard() {
        [hasFlippedCard, lockBoard] = [false, false];
        [firstCard, secondCard] = [null, null];
    }

    // Oyun yüklendiğinde başlat
    document.addEventListener("DOMContentLoaded", initMemoryGame);


    // ==========================================
    // 2. OYUN: GÜNEŞ VS AY DÜELLOSU
    // ==========================================
    let sunHP = 100;
    let moonHP = 100;
    let isBattling = false;

    function initBattle() {
        sunHP = 100;
        moonHP = 100;
        updateHealthBars();
        document.getElementById('battle-log').innerText = "Savaşı başlatmak için saldır!";
        document.getElementById('attack-btn').classList.remove('hidden');
        document.getElementById('reset-battle-btn').classList.add('hidden');
        document.getElementById('fighter-moon').classList.remove('opacity-30', 'grayscale');
        document.getElementById('fighter-sun').classList.remove('opacity-30', 'grayscale');
    }

    function updateHealthBars() {
        document.getElementById('hp-sun').style.width = Math.max(sunHP, 0) + '%';
        document.getElementById('hp-moon').style.width = Math.max(moonHP, 0) + '%';
    }

    function throwProjectile(attacker, callback) {
        const arena = document.getElementById('battle-arena');
        const star = document.createElement('i');
        star.className = 'fas fa-star absolute text-2xl transition-all duration-[600ms] ease-in-out z-20 drop-shadow-[0_0_10px_currentColor]';
        star.style.top = '50%';
        star.style.transform = 'translateY(-50%)';

        if (attacker === 'sun') {
            star.classList.add('text-gold');
            star.style.left = '15%'; // Başlangıç (Sol)
            arena.appendChild(star);
            
            // Animasyonu tetikle
            setTimeout(() => {
                star.style.left = '80%'; // Hedef (Sağ)
                star.style.transform = 'translateY(-50%) rotate(360deg) scale(1.5)';
            }, 50);

        } else {
            star.classList.add('text-pink-400');
            star.style.left = '80%'; // Başlangıç (Sağ)
            arena.appendChild(star);
            
            setTimeout(() => {
                star.style.left = '15%'; // Hedef (Sol)
                star.style.transform = 'translateY(-50%) rotate(-360deg) scale(1.5)';
            }, 50);
        }

        // Çarpma anı
        setTimeout(() => {
            star.remove();
            callback();
        }, 650);
    }

    function sunAttack() {
        if (isBattling || sunHP <= 0 || moonHP <= 0) return;
        isBattling = true;
        
        document.getElementById('battle-log').innerText = "Güneş yakıcı bir yıldız fırlattı!";
        
        throwProjectile('sun', () => {
            // Hasar hesapla (15-25 arası)
            let damage = Math.floor(Math.random() * 11) + 15;
            moonHP -= damage;
            updateHealthBars();
            
            const moonEl = document.getElementById('fighter-moon');
            moonEl.classList.add('damage-shake');
            setTimeout(() => moonEl.classList.remove('damage-shake'), 300);

            if (moonHP <= 0) {
                endBattle('sun');
            } else {
                setTimeout(moonCounterAttack, 800);
            }
        });
    }

    function moonCounterAttack() {
        if (sunHP <= 0 || moonHP <= 0) return;

        document.getElementById('battle-log').innerText = "Ay karanlık enerjisiyle karşılık veriyor!";
        
        throwProjectile('moon', () => {
            // Hasar hesapla (10-30 arası daha dengesiz)
            let damage = Math.floor(Math.random() * 21) + 10;
            sunHP -= damage;
            updateHealthBars();

            const sunEl = document.getElementById('fighter-sun');
            sunEl.classList.add('damage-shake');
            setTimeout(() => sunEl.classList.remove('damage-shake'), 300);

            if (sunHP <= 0) {
                endBattle('moon');
            } else {
                document.getElementById('battle-log').innerText = "Sıra sende!";
                isBattling = false;
            }
        });
    }

    function endBattle(winner) {
        document.getElementById('attack-btn').classList.add('hidden');
        document.getElementById('reset-battle-btn').classList.remove('hidden');
        
        if (winner === 'sun') {
            document.getElementById('battle-log').innerHTML = "<span class='text-gold font-bold'>Güneş kazandı! Aydınlık galip geldi.</span>";
            document.getElementById('fighter-moon').classList.add('opacity-30', 'grayscale');
        } else {
            document.getElementById('battle-log').innerHTML = "<span class='text-pink-400 font-bold'>Ay kazandı! Karanlık evreni sardı.</span>";
            document.getElementById('fighter-sun').classList.add('opacity-30', 'grayscale');
        }
        isBattling = false;
    }
</script>
{% endblock %}
