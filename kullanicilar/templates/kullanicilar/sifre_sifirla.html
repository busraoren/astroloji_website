{% extends 'burcs/base.html' %}
{% block title %}Şifremi Unuttum{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white/5 backdrop-blur rounded-2xl p-8 border border-purple-800/30">
    <h2 class="text-2xl font-bold text-yellow-400 mb-4 text-center">Şifremi Unuttum</h2>
    <p class="text-gray-300 text-sm mb-6 text-center">E-posta adresini gir, şifre sıfırlama linki gönderelim.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-semibold py-3 rounded-full transition mt-4">
            Gönder
        </button>
    </form>
</div>
{% endblock %}
